name: android-apk

on:
  push:
    branches: [feature/flutter-android-wgpu]
    paths:
      - 'app/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # x86_64: 本地容器是 aarch64 且无 binfmt，交叉工具链跑不了
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter scaffold (gradle wrapper + android project)
        working-directory: app
        run: flutter create --platforms=android --org io.github.astral --project-name osu_preview .

      - name: Copy plugin sources
        run: |
          mkdir -p app/android/app/src/main/kotlin/io/github/astral/osu \
                   app/android/app/src/main/kotlin/io/github/astral/osu_preview
          cp app/android_src/OsuRenderPlugin.kt app/android/app/src/main/kotlin/io/github/astral/osu/
          cp app/android_src/MainActivity.kt   app/android/app/src/main/kotlin/io/github/astral/osu_preview/

      - name: Patch gradle deps + manifest permissions
        run: python3 ci/patch_android.py

      - name: Build Rust cdylib for Android ABIs
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -p osu-android -o app/android/app/src/main/jniLibs build --release

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: osu-preview-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
